<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Анимации</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Основы анимации в CSS</h1>

    <!-- Кнопка с transition -->
    <button class="btn">Наведи на меня</button>

    <!-- Блок с transform: scale -->
    <div class="box">Блок</div>

    <!-- Мигающий текст -->
    <p class="text">Мигающий текст</p>

    <!-- Вращающийся элемент -->
    <div class="circle"></div>

</body>
</html>
